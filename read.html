<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Reading Unit - Zoom & Interactive Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        
        html, body { 
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%; overflow: hidden; 
            background-color: #f8fafc; 
            user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
        }

        @media print { body { display: none; } }

        #viewport {
            width: 100%; height: 100%; overflow: auto; 
            -webkit-overflow-scrolling: touch;
            position: relative; background: #f0f4f8;
            padding-bottom: 120px; 
        }

        #outerWrapper {
            position: relative; margin: 0 auto;
        }

        iframe {
            position: absolute; top: 0; left: 0;
            border: none; display: none; background: white;
            transform-origin: top left;
        }

        /* Bottom Toolbar - Zoom buttons removed for more space */
        .controls-bar {
            position: absolute; 
            bottom: max(20px, env(safe-area-inset-bottom)); 
            left: 50%;
            transform: translateX(-50%) translateZ(0); 
            display: flex; align-items: center; gap: 6px;
            background: rgba(15, 23, 42, 0.98); 
            padding: 8px 12px; border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 2147483647; width: 95vw; max-width: 400px;
            overflow-x: auto; flex-wrap: nowrap; justify-content: center;
            
            /* Hides scrollbar for Firefox, IE, and Edge */
            scrollbar-width: none; 
            -ms-overflow-style: none; 
        }

        /* Hides scrollbar for Chrome, Safari, and Opera */
        .controls-bar::-webkit-scrollbar {
            display: none;
        }
        /* Top Right Zoom Controls */
        .top-zoom-controls {
            position: absolute;
            top: max(15px, env(safe-area-inset-top));
            right: max(15px, env(safe-area-inset-right));
            display: flex;
            gap: 6px;
            z-index: 2147483647;
        }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 4px;
            background-color: #2563eb; color: white; padding: 8px 10px;
            border-radius: 20px; text-decoration: none; font-weight: 500; font-size: 12px;
            border: none; cursor: pointer; white-space: nowrap;
            touch-action: manipulation; flex-shrink: 0;
        }

        .btn svg { width: 14px; height: 14px; flex-shrink: 0; }
        .btn:active { background-color: #1d4ed8; transform: scale(0.92); }
        .btn.active { background-color: #dc3545; }

        .color-picker {
            width: 26px; height: 26px; border: 2px solid transparent; border-radius: 50%;
            cursor: pointer; background: none; padding: 0; flex-shrink: 0;
        }

        .back-btn {
            position: absolute;
            top: max(15px, env(safe-area-inset-top));
            left: max(15px, env(safe-area-inset-left));
            background-color: rgba(15, 23, 42, 0.95);
            color: white; z-index: 2147483647; padding: 6px 10px; border-radius: 20px;
        }

        #statusMsg {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 14px; color: #64748b; background: rgba(248, 250, 252, 0.95);
            padding: 20px; border-radius: 8px; z-index: 5000; text-align: center;
        }

        .hidden { display: none !important; }

        #recordingDetected {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); z-index: 2147483647; justify-content: center;
            align-items: center; color: white; font-size: 18px; font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Top Left Menu -->
    <a href="navigate.html" class="btn back-btn">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Menu
    </a>

    <!-- Top Right Zoom Buttons -->
    <div class="top-zoom-controls">
        <button class="btn" onclick="zoomIn()" title="Zoom In" style="background-color: rgba(15, 23, 42, 0.95);">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
            
        </button>
        <button class="btn" onclick="zoomOut()" title="Zoom Out" style="background-color: rgba(15, 23, 42, 0.95);">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20 12H4"></path></svg>
            
        </button>
    </div>

    <!-- Main Viewport -->
    <div id="viewport">
        <div id="outerWrapper">
            <iframe id="bookFrame" scrolling="no"></iframe>
        </div>
    </div>

    <!-- Bottom Drawing Tools -->
    <div class="controls-bar">
        <button id="penBtn" class="btn" onclick="setTool('pen')">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
            Pen
        </button>
        <button id="highlighterBtn" class="btn" onclick="setTool('highlighter')">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 21h10M5 16h14M8 3v5m8-5v5M6 8a2 2 0 00-2 2v4a2 2 0 002 2h12a2 2 0 002-2v-4a2 2 0 00-2-2H6z"></path></svg>
            Highlight
        </button>
        <button id="scrollBtn" class="btn active" onclick="setTool('scroll')">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
            Scroll
        </button>
        
        <input type="color" id="penColor" class="color-picker" value="#ef4444" title="Pen Color">
        
        <button class="btn" id="saveBtn" onclick="saveDrawings()" style="background-color: #10b981;">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
            Save
        </button>
        <button class="btn" onclick="clearDrawings()" style="background-color: #475569;">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            Clear
        </button>
    </div>
    
    <div id="statusMsg">Loading...</div>
    <div id="recordingDetected">⚠️ Content is protected-هذا المحتوى محمي لدى دائرة المكتبة الوطنية</div>
    
    <script>
        (function() {
            document.addEventListener('contextmenu', (e) => { e.preventDefault(); return false; });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'PrintScreen' || (e.ctrlKey && e.key === 'PrintScreen') || (e.shiftKey && e.key === 'PrintScreen')) {
                    e.preventDefault(); showRecordingAlert(); return false;
                }
                if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'C' || e.key === 'J')) || (e.ctrlKey && e.key === 's')) { e.preventDefault(); return false; }
            });
            ['copy','cut','paste','dragstart','drop','dblclick'].forEach(evt => document.addEventListener(evt, e => e.preventDefault()));
            
            let recordingDetected = false;
            document.addEventListener('visibilitychange', () => { document.hidden ? (recordingDetected = true, showRecordingAlert()) : (recordingDetected = false, hideRecordingAlert()); });
            window.addEventListener('blur', () => { if (!recordingDetected) { recordingDetected = true; showRecordingAlert(); } });
            window.addEventListener('focus', () => { if (recordingDetected) { recordingDetected = false; hideRecordingAlert(); } });

            function showRecordingAlert() { const alert = document.getElementById('recordingDetected'); if (alert) alert.style.display = 'flex'; }
            function hideRecordingAlert() { const alert = document.getElementById('recordingDetected'); if (alert) alert.style.display = 'none'; }
            window.addEventListener('keydown', (e) => { if (e.ctrlKey && e.altKey && e.key === 'I') e.preventDefault(); });
            if (window.console) { ['log', 'info', 'warn', 'error', 'debug'].forEach(func => { window.console[func] = () => {}; }); }
        })();
    </script>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const supabase = createClient('https://ilpvgaogfdpjieivrkpf.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlscHZnYW9nZmRwamllaXZya3BmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNDQ4MDEsImV4cCI6MjEwMjgyMDgwMX0.WWqu5VCmdfXH1i9XBP9TyksZQZMlMezWw3jHuMBG1YU');
        
        const outerWrapper = document.getElementById('outerWrapper');
        const bookFrame = document.getElementById('bookFrame');
        const statusMsg = document.getElementById('statusMsg');
        
        let currentTool = 'scroll'; 
        let currentFileName = '';
        let currentScale = 1;
        let pageWidth = 800;
        let pageHeight = 1000;
        let iframeCanvas = null;

        async function loadDocument() {
            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (!session) {
                    window.location.href = 'index.html';
                    return;
                }

                const urlParams = new URLSearchParams(window.location.search);
                currentFileName = urlParams.get('file');

                if (!currentFileName) {
                    statusMsg.textContent = "Error: No file specified.";
                    return;
                }

                const { data, error } = await supabase.storage
                    .from('secure_books')
                    .createSignedUrl(currentFileName, 3600);

                if (error || !data?.signedUrl) {
                    statusMsg.textContent = "Access Denied: File missing or session expired.";
                    return;
                }

                const response = await fetch(data.signedUrl);
                if (!response.ok) throw new Error('Fetch failed');
                
                const htmlContent = await response.text();
                
                const frameDoc = bookFrame.contentDocument || bookFrame.contentWindow.document;
                frameDoc.open();
                frameDoc.write(htmlContent);
                frameDoc.close();

                let attempts = 0;
                let checkReady = setInterval(() => {
                    const firstPage = frameDoc.querySelector('.pf, .page');
                    if ((firstPage && firstPage.offsetWidth > 50) || attempts > 20) {
                        clearInterval(checkReady);
                        setTimeout(() => setupArchitecture(frameDoc, currentFileName), 200);
                    }
                    attempts++;
                }, 100);

            } catch (err) {
                statusMsg.textContent = "Error loading document contents.";
            }
        }

        function setupArchitecture(frameDoc, fileName) {
            statusMsg.style.display = 'none';
            bookFrame.style.display = 'block';

            frameDoc.body.style.overflow = 'hidden';
            frameDoc.documentElement.style.overflow = 'hidden';
            frameDoc.body.style.margin = '0';

            const firstPage = frameDoc.querySelector('.pf, .page');
            pageWidth = firstPage ? firstPage.offsetWidth : 800;
            
            let maxH = 0;
            const pages = frameDoc.querySelectorAll('.pf, .page, img');
            pages.forEach(p => {
                const bottom = p.offsetTop + p.offsetHeight;
                if (bottom > maxH) maxH = bottom;
            });
            pageHeight = maxH > 0 ? maxH : frameDoc.body.scrollHeight;

            bookFrame.style.width = pageWidth + 'px';
            bookFrame.style.height = pageHeight + 'px';

            const screenWidth = window.innerWidth;
            if (screenWidth < pageWidth) {
                currentScale = screenWidth / pageWidth;
            } else {
                currentScale = 1;
            }

            iframeCanvas = frameDoc.createElement('canvas');
            iframeCanvas.id = 'drawingCanvas';
            iframeCanvas.style.position = 'absolute';
            iframeCanvas.style.top = '0';
            iframeCanvas.style.left = '0';
            iframeCanvas.style.pointerEvents = 'none'; 
            iframeCanvas.style.zIndex = '99999';
            
            iframeCanvas.style.mixBlendMode = 'multiply';
            iframeCanvas.style.touchAction = 'none';

            iframeCanvas.width = pageWidth;
            iframeCanvas.height = pageHeight;
            iframeCanvas.style.width = pageWidth + 'px';
            iframeCanvas.style.height = pageHeight + 'px';
            
            frameDoc.body.appendChild(iframeCanvas);

            const ctx = iframeCanvas.getContext('2d', { alpha: true, desynchronized: true });

            const watermarkText = frameDoc.createElement('div');
            watermarkText.style.position = 'fixed';
            watermarkText.style.top = '15px';
            watermarkText.style.left = '15px';
            watermarkText.style.color = 'rgba(255, 0, 0, 0.15)';
            watermarkText.style.fontSize = '14px';
            watermarkText.style.pointerEvents = 'none';
            watermarkText.style.zIndex = '999999';
            watermarkText.style.fontWeight = 'bold';
            frameDoc.body.appendChild(watermarkText);

            setInterval(() => {
                watermarkText.innerText = 'Protected - ' + new Date().getTime();
            }, 1000);

            applyZoom();
            setupDrawing(ctx, fileName);
        }

        function applyZoom() {
            bookFrame.style.transform = `scale(${currentScale})`;
            outerWrapper.style.width = (pageWidth * currentScale) + 'px';
            outerWrapper.style.height = (pageHeight * currentScale) + 'px';
        }

        window.zoomIn = function() {
            currentScale = Math.min(currentScale + 0.15, 3.0);
            applyZoom();
        };

        window.zoomOut = function() {
            currentScale = Math.max(currentScale - 0.15, 0.3);
            applyZoom();
        };

        function setupDrawing(ctx, fileName) {
            let painting = false;

            const savedData = localStorage.getItem(`drawing_${fileName}`);
            if (savedData) {
                const img = new Image();
                img.src = savedData;
                img.onload = () => ctx.drawImage(img, 0, 0, pageWidth, pageHeight);
            }

            function getCoords(e) {
                const rect = iframeCanvas.getBoundingClientRect();
                let clientX = e.clientX;
                let clientY = e.clientY;

                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                }

                const scaleX = pageWidth / rect.width;
                const scaleY = pageHeight / rect.height;

                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            }

            function startPosition(e) {
                if (currentTool === 'scroll') return;
                painting = true;
                const coords = getCoords(e);
                ctx.beginPath();
                ctx.moveTo(coords.x, coords.y);
                e.preventDefault(); 
            }

            function stopPosition() {
                painting = false;
                ctx.beginPath();
            }

            function draw(e) {
                if (!painting || currentTool === 'scroll') return;
                const coords = getCoords(e);
                
                if (currentTool === 'highlighter') {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.lineWidth = 24; 
                    ctx.lineCap = 'round';
                    ctx.strokeStyle = 'rgba(255, 235, 59, 0.7)';
                } else {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.lineWidth = 3;
                    ctx.lineCap = 'round';
                    ctx.strokeStyle = document.getElementById('penColor').value;
                }
                
                ctx.lineTo(coords.x, coords.y);
                ctx.stroke();
                e.preventDefault();
            }

            iframeCanvas.addEventListener('mousedown', startPosition);
            iframeCanvas.addEventListener('mouseup', stopPosition);
            iframeCanvas.addEventListener('mousemove', draw);
            iframeCanvas.addEventListener('mouseleave', stopPosition);

            iframeCanvas.addEventListener('touchstart', startPosition, { passive: false });
            iframeCanvas.addEventListener('touchend', stopPosition);
            iframeCanvas.addEventListener('touchmove', draw, { passive: false });
        }

        window.setTool = function(tool) {
            currentTool = tool;
            
            document.getElementById('penBtn').classList.remove('active');
            document.getElementById('highlighterBtn').classList.remove('active');
            document.getElementById('scrollBtn').classList.remove('active');

            if (tool === 'pen') document.getElementById('penBtn').classList.add('active');
            if (tool === 'highlighter') document.getElementById('highlighterBtn').classList.add('active');
            if (tool === 'scroll') document.getElementById('scrollBtn').classList.add('active');

            if (iframeCanvas) {
                iframeCanvas.style.pointerEvents = (tool === 'scroll') ? 'none' : 'auto'; 
            }
        };

        window.saveDrawings = function() {
            if (iframeCanvas) {
                const dataURL = iframeCanvas.toDataURL();
                localStorage.setItem(`drawing_${currentFileName}`, dataURL);
                
                const btn = document.getElementById('saveBtn');
                const originalHtml = btn.innerHTML;
                btn.innerHTML = `<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg> Saved!`;
                setTimeout(() => { btn.innerHTML = originalHtml; }, 2000);
            }
        };

        window.clearDrawings = function() {
            if (iframeCanvas && confirm('Clear all drawings?')) {
                const ctx = iframeCanvas.getContext('2d');
                ctx.clearRect(0, 0, iframeCanvas.width, iframeCanvas.height);
                localStorage.removeItem(`drawing_${currentFileName}`);
            }
        };

        loadDocument();
    </script>
</body>
</html>
